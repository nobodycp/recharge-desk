{% load i18n %}
{% comment %}
Single icon-button toggle. Shows a moon while in light mode (click =
"switch to dark"), a sun while in dark mode. JS lives in theme.js.
{% endcomment %}
<button
  type="button"
  class="rd-theme-btn app-theme-toggle"
  data-app-theme-toggle
  aria-label="{% trans 'Toggle color theme' %}"
  title="{% trans 'Toggle color theme' %}"
>
  <svg
    class="rd-theme-icon rd-theme-icon-sun"
    width="18" height="18" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
  >
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2"/>
    <path d="M12 20v2"/>
    <path d="m4.93 4.93 1.41 1.41"/>
    <path d="m17.66 17.66 1.41 1.41"/>
    <path d="M2 12h2"/>
    <path d="M20 12h2"/>
    <path d="m6.34 17.66-1.41 1.41"/>
    <path d="m19.07 4.93-1.41 1.41"/>
  </svg>
  <svg
    class="rd-theme-icon rd-theme-icon-moon"
    width="18" height="18" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
  >
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>
