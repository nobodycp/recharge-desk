{% load i18n %}<header class="rd-page-head">
  {% if back_url %}<a class="rd-page-head__back" href="{{ back_url }}"><svg class="rd-page-head__arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>{% if back_label %}{{ back_label }}{% else %}{% trans "Back" %}{% endif %}</a>{% endif %}
  <div class="rd-page-head__row">
    <div class="rd-page-head__titles">
      <h1 class="rd-heading-xl">{{ title }}</h1>
      {% if subtitle %}<p class="rd-page-head__sub">{{ subtitle }}</p>{% endif %}
    </div>
    {% if meta or actions %}<div class="rd-page-head__aside">
      {% if meta %}<span class="rd-page-head__meta tabular-nums">{{ meta }}</span>{% endif %}
      {{ actions }}
    </div>{% endif %}
  </div>
</header>
