{% extends "base_management.html" %}
{% load i18n %}
{% block content %}
<div class="rd-admin-page rd-admin-page--wide">
<div class="rd-dash-head mb-3">
  <h1 class="rd-heading-xl mb-0">{% trans "Users" %}</h1>
  <a class="btn btn-primary" href="{% url 'accounts:user_create' %}">{% trans "Create user" %}</a>
</div>

<div class="rd-card rd-toolbar mb-3">
  <form
    method="get"
    class="rd-filter-search"
    role="search"
    hx-get="{% url 'accounts:user_list' %}"
    hx-target="#user-list-results"
    hx-push-url="true"
    hx-indicator="#user-htmx-indicator"
    hx-trigger="submit, input changed delay:300ms from:#user-q, search from:#user-q"
  >
    <input type="hidden" name="sort" value="{{ sort }}">
    <input type="hidden" name="order" value="{{ order }}">
    <svg class="rd-filter-search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" class="form-control" id="user-q" name="q" value="{{ request.GET.q }}" placeholder="{% trans 'Username or full name…' %}" aria-label="{% trans 'Search' %}" autocomplete="off">
    <span id="user-htmx-indicator" class="htmx-indicator spinner-border spinner-border-sm text-primary rd-filter-search__spin" role="status" aria-hidden="true"></span>
  </form>
</div>

<div
  class="rd-card overflow-hidden rd-datagrid"
  id="user-list-results"
  hx-boost="true"
  hx-target="#user-list-results"
  hx-swap="innerHTML"
  hx-push-url="true"
  hx-indicator="#user-htmx-indicator"
>
  {% include "accounts/partials/user_list_results.html" %}
</div>
</div>
{% endblock %}
