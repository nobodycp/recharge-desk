{% load i18n l10n %}
{% if not product_groups %}
  <p class="rd-entry-empty">{% trans "Choose a company to see products." %}</p>
{% else %}
  <div class="employee-product-section">
    <div class="rd-entry-chips" id="employee-line-tiles">
      {% for g in product_groups %}
        <button
          type="button"
          class="employee-chip employee-product-line-tile {% if selected_line_id == g.line.pk|stringformat:'s' %}is-active{% endif %}"
          data-line-id="{{ g.line.pk }}"
          data-variant-count="{{ g.variants|length }}"
          data-default-product-id="{{ g.default_product_id }}"
          title="{{ g.line.name }}"
        >
          {% include "sales/partials/employee_icon_mark.html" with icon=g.line.icon title=g.line.name show_name=True %}
        </button>
      {% endfor %}
    </div>

    <div
      id="employee-packages-panel"
      class="employee-packages-panel {% if not selected_line_id %}d-none{% endif %}"
    >
      {% for g in product_groups %}
        <div
          id="packages-for-line-{{ g.line.pk }}"
          class="rd-entry-chips employee-packages-for-line {% if selected_line_id == g.line.pk|stringformat:'s' %}d-flex{% else %}d-none{% endif %}"
        >
          {% for p in g.variants %}
            <button
              type="button"
              class="employee-chip employee-package-chip employee-product-tile {% if selected_product_id == p.pk|stringformat:'s' %}is-active{% endif %}"
              data-product-id="{{ p.pk }}"
              data-product-cost="{{ p.cost_price|unlocalize }}"
              data-sim-unit-cost="{% if g.line.estimated_unit_cost %}{{ g.line.estimated_unit_cost|unlocalize }}{% else %}0{% endif %}"
              data-default-price="{{ p.default_sell_price|unlocalize }}"
              data-base-days="{{ p.base_days|default:30 }}"
              data-allow-partial-days="{% if g.line.allow_partial_days %}1{% else %}0{% endif %}"
              data-line-id="{{ g.line.pk }}"
              title="{{ p.display_name }} — {{ p.default_sell_price|unlocalize }} / {{ p.base_days|default:30 }}d"
            >
              <b class="rd-entry-chip__name">{% if p.variant_label %}{{ p.variant_label }}{% else %}{% trans "Default" %}{% endif %}</b>
              <span class="rd-entry-chip__price tabular-nums">{{ p.default_sell_price|floatformat:"-2" }}</span>
            </button>
          {% endfor %}
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}
