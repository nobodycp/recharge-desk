{% load i18n %}
{% if charge_dialog %}
<div data-rd-charge-notice hidden>{{ charge_dialog }}</div>
{% endif %}
{% if charge_notice_wait %}
<div
  data-rd-charge-wait
  hidden
  data-url="{% url 'sales:employee_charge_notice' %}"
  data-ack-url="{% url 'sales:employee_charge_notice' %}?ack=1"
  data-wait-label="{% trans 'Charging the number at the provider…' %}"
  data-wait-msg="{% trans 'Still charging… Follow the status in My entries.' %}"
  data-ok-msg="{% trans 'Charged' %}"
></div>
{% endif %}
<script>
(function () {
  if (window.__rdChargeNotice && window.__rdChargeNotice.timer) {
    clearInterval(window.__rdChargeNotice.timer);
  }
  var state = { timer: null, shown: false, active: false };
  window.__rdChargeNotice = state;

  function clearPendingToasts() {
    document.querySelectorAll(".rd-toast[data-rd-charge-pending]").forEach(function (el) {
      el.remove();
    });
  }

  function goClean() {
    var path = location.pathname;
    if (window.rdNavigate) window.rdNavigate(path);
    else location.assign(path);
  }

  function stopPoll() {
    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }
  }

  function afterNotice(ackUrl) {
    clearPendingToasts();
    if (!ackUrl) {
      goClean();
      return;
    }
    fetch(ackUrl, { credentials: "same-origin", headers: { Accept: "application/json" } })
      .catch(function () {})
      .then(goClean);
  }

  function showError(text, ackUrl) {
    text = String(text || "").trim();
    if (!text || state.shown) return false;
    state.shown = true;
    stopPoll();
    clearPendingToasts();
    if (window.rdConfirm) {
      try {
        window.rdConfirm(text, { notice: true, error: true }).then(function () {
          afterNotice(ackUrl || "");
        });
        return true;
      } catch (err) {
        /* fall through */
      }
    }
    if (window.rdToast) {
      window.rdToast(text, "error");
      setTimeout(function () { afterNotice(ackUrl || ""); }, 2500);
      return true;
    }
    return false;
  }

  function showSuccess(okMsg) {
    if (state.shown) return;
    state.shown = true;
    stopPoll();
    clearPendingToasts();
    if (okMsg && window.rdToast) window.rdToast(okMsg, "success");
    goClean();
  }

  function showLoading(label) {
    if (!window.rdConfirm) return false;
    try {
      window.rdConfirm(label || "…", { notice: true, loading: true });
      return true;
    } catch (err) {
      return false;
    }
  }

  function handlePayload(data, ackUrl, waitMsg, okMsg) {
    if (!data || state.shown) return;
    var status = data.status || (data.message ? "refused" : "pending");
    if (status === "refused" || status === "failed") {
      showError(data.message || waitMsg || "…", status === "refused" ? ackUrl : "");
      return;
    }
    if (status === "ok") {
      showSuccess(okMsg || "");
    }
  }

  function pollOnce(url, ackUrl, waitMsg, okMsg) {
    fetch(url, { credentials: "same-origin", headers: { Accept: "application/json" } })
      .then(function (response) {
        if (!response.ok) throw new Error("charge-notice");
        return response.json();
      })
      .then(function (data) { handlePayload(data, ackUrl, waitMsg, okMsg); })
      .catch(function () {});
  }

  function boot(root) {
    if (state.active || !root || !root.querySelector) return;
    var node = document.querySelector("[data-rd-charge-notice]");
    var wait = document.querySelector("[data-rd-charge-wait]");
    if (!node && !wait) return;
    state.active = true;

    if (node) {
      showError(node.textContent, "");
      return;
    }

    var url = wait.getAttribute("data-url");
    var ackUrl = wait.getAttribute("data-ack-url") || "";
    var waitLabel = wait.getAttribute("data-wait-label") || "";
    var waitMsg = wait.getAttribute("data-wait-msg") || "";
    var okMsg = wait.getAttribute("data-ok-msg") || "";
    showLoading(waitLabel);
    var tries = 0;
    pollOnce(url, ackUrl, waitMsg, okMsg);
    state.timer = setInterval(function () {
      if (state.shown) {
        stopPoll();
        return;
      }
      tries += 1;
      if (tries > 24) {
        stopPoll();
        showError(waitMsg || "…", "");
        return;
      }
      pollOnce(url, ackUrl, waitMsg, okMsg);
    }, 700);
  }

  if (window.htmx) htmx.onLoad(boot);
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { boot(document); });
  } else {
    boot(document);
  }
})();
</script>
