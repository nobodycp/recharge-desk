{% load i18n %}
{% if charge_dialog %}
<div data-rd-charge-notice hidden>{{ charge_dialog }}</div>
{% endif %}
{% if charge_notice_wait %}
<div
  data-rd-charge-wait
  hidden
  data-url="{% url 'sales:employee_charge_notice' %}"
  data-wait-msg="{% trans 'Still charging… Follow the status in My entries.' %}"
></div>
{% endif %}
<script>
(function () {
  function clearPendingToasts() {
    document.querySelectorAll(".rd-toast[data-rd-charge-pending]").forEach(function (el) {
      el.remove();
    });
  }
  function afterNotice() {
    // Consume the refusal on the server (take/ack) and clear wait toasts.
    if (window.rdNavigate) window.rdNavigate(location.pathname + location.search);
    else location.reload();
  }
  function show(text) {
    text = String(text || "").trim();
    if (!text) return false;
    clearPendingToasts();
    if (window.rdConfirm) {
      try {
        window.rdConfirm(text, { notice: true, error: true }).then(afterNotice);
        return true;
      } catch (err) {
        /* fall through to toast */
      }
    }
    if (window.rdToast) {
      window.rdToast(text, "error");
      setTimeout(afterNotice, 2500);
      return true;
    }
    return false;
  }
  function boot(root) {
    if (!root || !root.querySelector) return;
    var node = root.querySelector("[data-rd-charge-notice]");
    if (node && !node.dataset.rdShown) {
      if (show(node.textContent)) node.dataset.rdShown = "1";
    }
    var wait = root.querySelector("[data-rd-charge-wait]");
    if (!wait || wait.dataset.rdStarted || (node && node.dataset.rdShown)) return;
    wait.dataset.rdStarted = "1";
    var url = wait.getAttribute("data-url");
    var waitMsg = wait.getAttribute("data-wait-msg") || "";
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      if (tries > 24) {
        clearInterval(timer);
        clearPendingToasts();
        // Never a success toast — a late refusal must not look like "charged".
        if (waitMsg && window.rdToast) window.rdToast(waitMsg, "info");
        return;
      }
      fetch(url, { credentials: "same-origin", headers: { Accept: "application/json" } })
        .then(function (response) {
          if (!response.ok) throw new Error("charge-notice");
          return response.json();
        })
        .then(function (data) {
          if (data && data.message) {
            clearInterval(timer);
            show(data.message);
          }
        })
        .catch(function () {});
    }, 700);
  }
  if (window.htmx) htmx.onLoad(boot);
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { boot(document); });
  } else {
    boot(document);
  }
})();
</script>
