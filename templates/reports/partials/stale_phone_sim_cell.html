{% load i18n %}
{# Number / ICCID / notes + Save. HTMX refreshes #phone-lines-list-results only. #}
<div class="rd-stale-sim-cell" id="stale-sim-{{ row.ref_key }}">
  <form
    method="post"
    id="stale-sim-form-{{ row.ref_key }}"
    action="{% url 'reports:stale_phone_sim_save' ref_key=row.ref_key %}"
    class="rd-stale-sim-form d-flex flex-column gap-1"
    hx-post="{% url 'reports:stale_phone_sim_save' ref_key=row.ref_key %}"
    hx-target="#phone-lines-list-results"
    hx-swap="innerHTML"
    hx-boost="false"
  >
    {% csrf_token %}
    <input type="hidden" name="next_query" value="{{ list_query }}">
    <input
      type="text"
      name="reference_number"
      value="{% if form %}{{ form.reference_number.value|default:row.display_reference }}{% else %}{{ row.display_reference }}{% endif %}"
      class="form-control form-control-sm font-monospace{% if form and form.reference_number.errors %} is-invalid{% endif %}"
      placeholder="{% trans 'Number / reference' %}"
      autocomplete="off"
      inputmode="tel"
      aria-label="{% trans 'Number / reference' %}"
    >
    <input
      type="text"
      name="sim_identifier"
      value="{% if form %}{{ form.sim_identifier.value|default:row.sim_identifier }}{% else %}{{ row.sim_identifier }}{% endif %}"
      class="form-control form-control-sm rd-stale-sim-input{% if form and form.sim_identifier.errors %} is-invalid{% endif %}"
      placeholder="{% trans 'ICCID / SIM' %}"
      autocomplete="off"
      inputmode="text"
      aria-label="{% trans 'ICCID / SIM' %}"
    >
    <input
      type="text"
      name="notes"
      value="{% if form %}{{ form.notes.value|default:row.notes }}{% else %}{{ row.notes }}{% endif %}"
      class="form-control form-control-sm{% if form and form.notes.errors %} is-invalid{% endif %}"
      placeholder="{% trans 'Note…' %}"
      autocomplete="off"
      aria-label="{% trans 'Notes' %}"
    >
    <button type="submit" class="btn btn-sm btn-outline-primary rd-stale-phone-actions__btn">
      {% trans "Save" %}
    </button>
  </form>
  <div class="form-text mt-1 d-none d-md-block">
    {% trans "Save updates number, ICCID, and notes. Changing the number restarts the disconnect countdown." %}
  </div>
</div>
