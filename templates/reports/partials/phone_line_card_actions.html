{% load i18n %}
{# Shared edit / delete / renew actions for desktop + mobile phone-line rows. #}
<div class="d-flex flex-column gap-1 {% if stacked %}w-100{% else %}align-items-stretch{% endif %}">
  <a
    class="btn btn-sm btn-outline-secondary{% if stacked %} w-100{% endif %}"
    href="{% url 'reports:stale_phone_edit' ref_key=row.ref_key %}{% if list_query %}?next_query={{ list_query|urlencode }}{% endif %}"
  >{% trans "Edit number" %}</a>
  <form
    method="post"
    action="{% url 'reports:phone_line_delete' ref_key=row.ref_key %}"
    class="{% if stacked %}w-100{% else %}d-inline{% endif %}"
    hx-boost="false"
    onsubmit="return confirm('{% filter escapejs %}{% trans "Remove this number from the line statement? Sale history stays; it will no longer appear in inventory or dashboard counts." %}{% endfilter %}');"
  >
    {% csrf_token %}
    <input type="hidden" name="next_query" value="{{ list_query }}">
    <button type="submit" class="btn btn-sm btn-outline-danger{% if stacked %} w-100{% endif %}">{% trans "Delete" %}</button>
  </form>
  {% if row.status == "overdue" %}
    <form
      method="post"
      action="{% url 'reports:phone_line_renew' ref_key=row.ref_key %}"
      class="{% if stacked %}w-100{% else %}d-inline{% endif %}"
      hx-boost="false"
      onsubmit="return confirm('{% filter escapejs %}{% trans "Renew this overdue line as a 1-day charge (no sale created)? It will leave “left the agency” status for another period." %}{% endfilter %}');"
    >
      {% csrf_token %}
      <input type="hidden" name="next_query" value="{{ list_query }}">
      <button type="submit" class="btn btn-sm btn-outline-primary{% if stacked %} w-100{% endif %}">{% trans "Renew 1 day" %}</button>
    </form>
  {% endif %}
</div>
