{% load i18n %}
{# Compact Delete / Renew — HTMX refreshes the results grid only. #}
<div class="rd-stale-phone-actions{% if stacked %} rd-stale-phone-actions--stacked{% endif %}">
  <form
    method="post"
    action="{% url 'reports:phone_line_delete' ref_key=row.ref_key %}"
    class="rd-stale-phone-actions__item"
    hx-post="{% url 'reports:phone_line_delete' ref_key=row.ref_key %}"
    hx-target="#phone-lines-list-results"
    hx-swap="innerHTML"
    hx-boost="false"
    hx-confirm="{% trans "Remove this number from the line statement? Sale history stays; it will no longer appear in inventory or dashboard counts." %}"
  >
    {% csrf_token %}
    <input type="hidden" name="next_query" value="{{ list_query }}">
    <button type="submit" class="btn btn-sm btn-outline-danger rd-stale-phone-actions__btn">{% trans "Delete" %}</button>
  </form>
  {% if row.status == "overdue" %}
    <form
      method="post"
      action="{% url 'reports:phone_line_renew' ref_key=row.ref_key %}"
      class="rd-stale-phone-actions__item"
      hx-post="{% url 'reports:phone_line_renew' ref_key=row.ref_key %}"
      hx-target="#phone-lines-list-results"
      hx-swap="innerHTML"
      hx-boost="false"
      hx-confirm="{% trans "Renew this overdue line as a 1-day charge (no sale created)? It will leave “left the agency” status for another period." %}"
    >
      {% csrf_token %}
      <input type="hidden" name="next_query" value="{{ list_query }}">
      <button type="submit" class="btn btn-sm btn-outline-primary rd-stale-phone-actions__btn">{% trans "Renew 1 day" %}</button>
    </form>
  {% endif %}
</div>
