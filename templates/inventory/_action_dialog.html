{% load i18n %}
<div class="rd-inv-dialog" id="rd-inv-action-dialog" hidden aria-hidden="true">
  <div class="rd-inv-dialog__backdrop" data-inv-dialog-close></div>
  <div class="rd-inv-dialog__panel rd-card" role="dialog" aria-modal="true" aria-labelledby="rd-inv-action-title">
    <div class="rd-inv-dialog__header d-flex justify-content-between align-items-center gap-2 mb-3">
      <h2 class="h6 mb-0" id="rd-inv-action-title" data-inv-dialog-title></h2>
      <button type="button" class="btn-close btn-sm" data-inv-dialog-close aria-label="{% trans 'Close' %}"></button>
    </div>
    <form method="post" id="rd-inv-action-form" action="#">
      {% csrf_token %}
      <input type="hidden" name="next" id="rd-inv-action-next" value="">
      <div class="d-grid gap-2" data-inv-field="set-qty" hidden>
        <label class="form-label small mb-0" for="rd-inv-set-qty">{% trans "New quantity" %}</label>
        <input type="number" name="quantity" id="rd-inv-set-qty" class="form-control form-control-sm" min="0">
      </div>
      <div class="d-grid gap-2" data-inv-field="delta" hidden>
        <label class="form-label small mb-0" for="rd-inv-delta">{% trans "Adjustment (+/-)" %}</label>
        <input type="number" name="signed_delta" id="rd-inv-delta" class="form-control form-control-sm">
      </div>
      <div class="d-grid gap-2" data-inv-field="damaged-qty" hidden>
        <label class="form-label small mb-0" for="rd-inv-damaged-qty">{% trans "Quantity" %}</label>
        <input type="number" name="quantity" id="rd-inv-damaged-qty" class="form-control form-control-sm" min="1" value="1">
      </div>
      <div class="d-grid gap-2" data-inv-field="reason">
        <label class="form-label small mb-0" for="rd-inv-reason">{% trans "Reason" %}</label>
        <textarea name="reason" id="rd-inv-reason" class="form-control form-control-sm" rows="2"></textarea>
      </div>
      <div class="d-grid gap-2" data-inv-field="notes" hidden>
        <label class="form-label small mb-0" for="rd-inv-notes">{% trans "Notes" %}</label>
        <textarea name="notes" id="rd-inv-notes" class="form-control form-control-sm" rows="2"></textarea>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-inv-dialog-close>{% trans "Cancel" %}</button>
        <button type="submit" class="btn btn-primary btn-sm" data-inv-submit>{% trans "Save" %}</button>
      </div>
    </form>
  </div>
</div>
<div id="rd-inv-actions-popover" class="rd-inv-actions-popover" hidden>
  <div class="rd-inv-actions-popover__panel"></div>
</div>
