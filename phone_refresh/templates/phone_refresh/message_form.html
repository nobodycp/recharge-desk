{% extends "base_management.html" %}
{% load kit %}
{% block content %}
<div class="rd-page rd-page--form">
  {% rd_page_header title "حرّر النص الذي يظهر للعميل لهذه الحالة." %}
  {% end_rd_page_header %}
  <div class="rd-card">
    <div class="rd-card-body">
      <form method="post" class="d-grid gap-3">
        {% csrf_token %}
        {% rd_fields form %}
        <div class="rd-form-actions">
          <button class="btn btn-primary" type="submit">حفظ</button>
          <a class="btn btn-outline-secondary"
             href="{% url 'phone_refresh:settings' %}?tab=messages">إلغاء</a>
        </div>
      </form>
      {% if message %}
        <div class="border-top pt-3 mt-3">
          <form method="post"
                action="{% url 'phone_refresh:message_delete' pk=message.pk %}"
                onsubmit="return confirm('حذف هذه الرسالة؟');">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger">حذف الرسالة</button>
          </form>
        </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
